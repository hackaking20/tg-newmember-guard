name: Run Guard Bot

# ──────────────────────────────────────────────────────────────────────
# This workflow STARTS the bot, lets it run for ~5 hours, then the
# GitHub Actions job timeout ends the run. The next scheduled run picks
# up where it left off (guard.db is restored from cache).
#
# REQUIREMENTS (Settings > Secrets and variables > Actions):
#   Secrets:  BOT_TOKEN, ADMIN_CHAT_ID, GROUP_ID, ADMIN_IDS
#   Variables (optional, have defaults): MIN_ACCOUNT_AGE_DAYS,
#             TRUST_AFTER_MESSAGES, AUTO_PASS_OLD_ACCOUNTS, REPOST_HELD
#
# NOTE: scheduled workflows only run on the DEFAULT branch (main).
# ──────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every 5 hours (UTC). GitHub may delay cron by up to ~30 min.
    - cron: "0 */5 * * *"
  workflow_dispatch: {} # manual trigger from the Actions tab

# Prevent two bot instances running at once (Telegram allows only one
# long-polling connection per bot token).
concurrency:
  group: guard-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 295 # just under 5h; GitHub max is 360 (6h)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore guard.db from cache
        uses: actions/cache/restore@v4
        with:
          path: guard.db
          key: guard-db-dummy  # never matches exactly; restore-keys does the work
          restore-keys: |
            guard-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          MIN_ACCOUNT_AGE_DAYS: ${{ vars.MIN_ACCOUNT_AGE_DAYS }}
          TRUST_AFTER_MESSAGES: ${{ vars.TRUST_AFTER_MESSAGES }}
          AUTO_PASS_OLD_ACCOUNTS: ${{ vars.AUTO_PASS_OLD_ACCOUNTS }}
          REPOST_HELD: ${{ vars.REPOST_HELD }}
        run: python bot.py

      - name: Save guard.db to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: guard.db
          key: guard-db-${{ github.run_id }}
